app:
  name: web-basic
  env: dev
  port: 8090
  mode: debug
  timezone: Asia/Shanghai
  lang: zh-CN
  admin_password: "" # 首次初始化超管密码，留空则随机生成并打印日志
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

mysql:
  dsn: "root:root123@tcp(127.0.0.1:3307)/web_basic?charset=utf8mb4&parseTime=True&loc=Local&timeout=10s&clientFoundRows=true"
  max_idle: 10
  max_open: 100
  conn_max_lifetime_min: 60
  slow_threshold_ms: 200
  auto_migrate: true # 生产建议 false，由发布流程显式执行
  log_sql: false

redis:
  addr: "127.0.0.1:6380"
  password: ""
  db: 0
  prefix: "web:"
  pool_size: 50

jwt:
  secret: "dev-only-secret-please-change-in-production"
  secret_previous: ""
  access_ttl: 2h
  refresh_ttl: 168h
  issuer: web-basic

auth:
  single_session: false
  max_fail_count: 5
  lock_minutes: 10
  captcha_enabled: true
  pwd_min_len: 8
  pwd_expire_days: 0

upload:
  max_size_mb: 20
  allow_ext: [jpg, jpeg, png, gif, webp, pdf, doc, docx, xls, xlsx, ppt, pptx, zip, txt, mp4]

storage:
  type: local # local | oss
  local:
    base_dir: ./storage
    url_prefix: /static
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket: my-bucket
    access_key: ""
    secret_key: ""
    domain: ""
    private: false
    sign_expire: 3600

log:
  level: info
  dir: ./logs
  max_size_mb: 100
  max_backups: 30
  max_age_days: 30
  console: true

# 租户：隔离随登录态常开，这里只配置默认租户
tenant:
  default_id: 1

# Prometheus 指标（GET /metrics）；token 非空时抓取需带 X-Metrics-Token 头
metrics:
  enabled: true
  token: ""

# 在线接口文档（/swagger/index.html，完全离线，无 CDN 依赖）
swagger:
  enabled: true
  title: web-basic 接口文档
  desc: Go + Gin 后端 · RBAC 权限 · 多租户

scheduler:
  enabled: true
  pool_size: 10
  # 是否允许「Shell 脚本」型定时任务（job_type=3）。
  # 打开后，拥有 system:job:create 权限的用户可以在服务器上执行任意 sh/bash/python 脚本，
  # 仅在你明确需要「后台自定义任务内容」且能管控权限时开启；默认关闭。
  shell_enabled: false
# 业务系统对接（开放接口）：把外部系统的消息/待办推进本系统
# 打开后必须配置 api_key（生产用环境变量 APP__INTEGRATION__API_KEY 覆盖）
integration:
  enabled: false
  api_key: ""
  # 开放接口写入的租户
  tenant_id: 1
