# MySQL 5.7 变体：docker compose -f deploy/docker-compose.mysql57.yml up -d --build
# 说明：
#   1. MySQL 5.7 不支持窗口函数 / CTE，本项目的权限与组织查询均未使用（见 docs/03-数据库设计.md）
#   2. 5.7 默认 sql_mode 含 ONLY_FULL_GROUP_BY，此处显式指定更宽松的组合，DDL 也已避免隐式排序分组
#   3. 若沿用 8.0 的数据目录需先导出再导入，禁止直接挂载同一 volume
#
# 环境变量命名规则：viper 前缀 APP + 配置路径用 __ 分隔，例如 mysql.dsn → APP__MYSQL__DSN。
# 宿主机端口同样可覆盖：APP_PORT=8081 MYSQL_PORT=3308 REDIS_PORT=6381
name: web-basic57

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    image: web-basic:latest
    container_name: web-basic-app57
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      TZ: Asia/Shanghai
      # 运行模式与端口（覆盖镜像内的开发默认值）
      APP__APP__ENV: prod
      APP__APP__MODE: release
      APP__APP__PORT: "8080"
      # 数据库：MySQL 5.7 容器；clientFoundRows=true 不可省略（影响行数语义）
      APP__MYSQL__DSN: "root:root123@tcp(mysql57:3306)/web_basic?charset=utf8mb4&parseTime=True&loc=Local&timeout=10s&clientFoundRows=true"
      # Redis
      APP__REDIS__ADDR: "redis:6379"
      APP__REDIS__PASSWORD: ""
      # 文件存储：容器内使用本地磁盘（对应 /app/storage 挂载卷）
      APP__STORAGE__TYPE: local
      # 生产务必覆盖：JWT 密钥（>=32 位随机串）与管理员初始密码
      APP__JWT__SECRET: "change-me-please-use-32chars-random-secret"
      APP__JWT__SECRET_PREVIOUS: ""
      APP__APP__ADMIN_PASSWORD: Admin@123456
    volumes:
      - app-logs:/app/logs
      - app-storage:/app/storage
    depends_on:
      mysql57:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - web-basic57

  mysql57:
    image: mysql:5.7
    container_name: web-basic-mysql57
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower_case_table_names=0
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: web_basic
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql57-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - web-basic57

  redis:
    image: redis:7-alpine
    container_name: web-basic-redis57
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - web-basic57

volumes:
  mysql57-data:
  redis-data:
  app-logs:
  app-storage:

networks:
  web-basic57:
    driver: bridge
