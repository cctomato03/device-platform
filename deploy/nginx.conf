# 前后端分离部署示例（Nginx 托管前端 dist，反向代理 /api 到 Go 服务）
# 用法：替换 server_name 与 upstream 地址后，放入 /etc/nginx/conf.d/default.conf

upstream web_basic_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name admin.example.com;

    charset utf-8;
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 前端静态资源（Vite 构建产物，文件名带 hash，可长缓存）
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://web_basic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 上传文件（本地存储模式：storage.local.url_prefix=/static）
    location /static/ {
        proxy_pass http://web_basic_backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 健康检查不外暴业务端口
    location = /healthz {
        proxy_pass http://web_basic_backend/healthz;
        access_log off;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
