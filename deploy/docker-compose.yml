# 设备管理平台 · 容器编排（可选，设备上更推荐 systemd 安装）
#
# 平台零外部依赖：数据库是嵌入式 SQLite，缓存是进程内实现，不再需要 MySQL / Redis。
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 注意：
#   - 设备管理（网络接口/静态路由/防火墙/NAT/QoS）需要 NET_ADMIN、NET_RAW 能力；
#   - 插件若要管理宿主机或使用 docker 运行时，需要挂载 /var/run/docker.sock；
#   - /data 卷存放数据库、日志、插件与上传文件，备份该目录即可。
services:
  device-platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: device-platform:latest
    container_name: device-platform
    restart: unless-stopped
    ports:
      - '8090:8090'
    environment:
      APP__APP__ENV: prod
      APP__APP__MODE: release
      APP__JWT__SECRET: 'please-change-me-to-a-random-32+-char-secret'
      APP__APP__ADMIN_PASSWORD: 'Admin@123456'
    volumes:
      - ./data:/data
      # 需要管理宿主机网络/防火墙时打开下面几行（privileged 更简单，但权限更大）
      # - /var/run/docker.sock:/var/run/docker.sock
      # - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    network_mode: host
    healthcheck:
      test: ['CMD', '/app/device-platform', '-v']
      interval: 30s
      timeout: 5s
      retries: 3
